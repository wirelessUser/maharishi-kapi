# =============================================================================
# SECTION 5: DATABASE SCHEMA RECOMMENDATIONS
# =============================================================================

database_schema:

  notes: |
    This section provides database design recommendations for storing
    the home page content. A robust backend should normalize this data
    to enable easy updates, filtering, and analytics.

  tables:

    courses:
      columns:
        - id (PK, UUID)
        - title (string, required)
        - sanskritTag (string)
        - category (enum: Astrology, Vastu Shastra, Wellness & Marma, etc.)
        - description (text)
        - imageUrl (string)
        - price (decimal)
        - originalPrice (decimal)
        - duration (string)
        - rating (string)
        - isFeatured (boolean)
        - createdAt (timestamp)
        - updatedAt (timestamp)
      indexes:
        - isFeatured, createdAt (for featured course fetching)
        - category (for filtering)

    roles:
      columns:
        - id (PK, UUID)
        - key (string, unique)
        - devanagariNum (string)
        - icon (string, FontAwesome class)
        - title (string)
        - specialization (string)
        - description (text)
        - imageUrl (string)
        - pressLogos (boolean)
        - displayOrder (int)
      indexes:
        - displayOrder (for carousel ordering)

    consultation_services:
      columns:
        - id (PK, UUID)
        - title (string)
        - sanskritTag (string)
        - category (string)
        - imageUrl (string)
        - price (decimal)
        - originalPrice (decimal)
        - duration (string)
        - summary (text)
        - devanagariNum (string)

    consultants:
      columns:
        - id (PK, UUID)
        - key (string)
        - devanagariNum (string)
        - name (string)
        - sanskritTag (string)
        - specialization (string)
        - photoUrl (string)
        - experience (string)
        - location (string)
        - isActive (boolean)
        - createdAt (timestamp)
      indexes:
        - specialization, isActive

    reviews:
      columns:
        - id (PK, UUID)
        - authorName (string)
        - location (string)
        - rating (int, 1-5)
        - reviewText (text)
        - tag (string)
        - source (enum: google, direct, etc.)
        - createdAt (timestamp)
        - isFeatured (boolean)
      indexes:
        - isFeatured, rating, createdAt

    social_media_content:
      columns:
        - id (PK, UUID)
        - contentType (enum: youtube_video, instagram_reel)
        - externalId (string)
        - title (string)
        - category (string)
        - url (string)
        - thumbnailUrl (string)
        - duration (string, nullable)
        - isActive (boolean)
        - createdAt (timestamp)
      indexes:
        - contentType, isActive, createdAt

