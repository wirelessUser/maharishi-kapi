# SECTION 8: MIGRATION NOTES FROM FRONTEND HARDCODING
# =============================================================================

hardcoded_to_migrate:

  components_with_static_data:
    - hero-section: zodiacSigns array (KEEP as static)
    - generations: lineage array (MIGRATE to /api/lineage/generations)
    - stats: tickerItems array (MIGRATE to /api/stats/ticker)
    - featured-courses: courses array (MIGRATE to /api/courses/featured)
    - legacy: lineagePillars array (MIGRATE to /api/lineage/pillars)
    - roles: roles array (MIGRATE to /api/roles)
    - journey: paths array (MIGRATE to /api/journey-paths)
    - immersive: appScreens array (MIGRATE to /api/app-features)
    - consultation: consultations array (MIGRATE to /api/consultations/tiers)
    - trained-consultants: consultants array (MIGRATE to /api/consultants)
    - stories: googleReviews array (MIGRATE to /api/reviews/google)
    - downloads: codices array (MIGRATE to /api/sacred-codex)
    - instagram: videos & reels arrays (MIGRATE to /api/social/youtube-videos & /api/social/instagram-reels)

  migration_strategy:
    1. Create backend API with mock data (same hardcoded arrays)
    2. Update Angular components to fetch from API instead of hardcoding
    3. Test API responses match frontend expectations exactly
    4. Connect to database with real data
    5. Gradually enable live data sync (Google, YouTube, Instagram APIs)

---

# =============================================================================
# SECTION 9: CACHING & PERFORMANCE NOTES
# =============================================================================

caching_strategy:

  frontend_caching:
    strategy: |
      Angular HttpClient should use HTTP caching headers from backend.
      Consider implementing Angular's built-in cache service for:
      - Hero (cache forever, refresh on demand)
      - Generations/Lineage (cache 7 days)
      - Stats (cache 1 hour, refresh more frequently for live counts)
      - Courses/Services (cache 1 hour, bust cache on inventory change)
      - Roles (cache 7 days)
      - Social media (cache 1 hour, refresh frequently)

  backend_response_headers:
    hero: "Cache-Control: public, max-age=86400"
    generations: "Cache-Control: public, max-age=604800"
    stats: "Cache-Control: public, max-age=3600"
    courses: "Cache-Control: public, max-age=3600"
    social: "Cache-Control: public, max-age=3600"
    reviews: "Cache-Control: public, max-age=1800" # Fresher reviews

  cdn_strategy: |
    Images (courses, roles, consultants) should be served via CDN.
    Consider lazy-loading images with intersection observer.

