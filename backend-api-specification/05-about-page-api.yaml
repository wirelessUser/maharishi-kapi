---
# ABOUT PAGE API SPECIFICATION
# Purpose: Provide founder biography, roles, authority statistics, and press coverage

api_version: "1.0"
page: "About Page"
module: "About & Authority"

base_url: "/api/v1/about"

endpoints:

  # ========================================
  # GET /api/v1/about/founder
  # ========================================
  # Description: Get founder biography and key information
  # Auth: None (Public)
  founder_info:
    method: GET
    path: "/founder"
    description: "Fetch founder biography and authority credentials"
    authentication: "none"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "object"
          properties:
            id:
              type: "string"
            name:
              type: "string"
              example: "Acharya Alok Awasthi"
            title:
              type: "string"
              example: "Founder & Lead Instructor"
            bio:
              type: "string"
            fullBio:
              type: "string"
              format: "long text"
            profileImage:
              type: "string"
              format: "url"
            backgroundImage:
              type: "string"
              format: "url"
            yearsOfExperience:
              type: "integer"
              example: 25
            lineageGeneration:
              type: "integer"
              example: 9
            socialLinks:
              type: "object"
              properties:
                instagram:
                  type: "string"
                  format: "url"
                youtube:
                  type: "string"
                  format: "url"
                threads:
                  type: "string"
                  format: "url"
            expertise:
              type: "array"
              items:
                type: "string"

  # ========================================
  # GET /api/v1/about/stats
  # ========================================
  # Description: Get authority statistics
  # Auth: None (Public)
  authority_stats:
    method: GET
    path: "/stats"
    description: "Fetch key statistics demonstrating authority and reach"
    authentication: "none"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "array"
          items:
            type: "object"
            properties:
              num:
                type: "string"
                example: "25+"
              label:
                type: "string"
                example: "Years of Tapasya"
              sub:
                type: "string"
                example: "Saraswat Guru Lineage"
              icon:
                type: "string"

  # ========================================
  # GET /api/v1/about/master-roles
  # ========================================
  # Description: Get information about the founder's 5 master roles
  # Auth: None (Public)
  master_roles:
    method: GET
    path: "/master-roles"
    description: "Fetch details about the founder's 5 master professional roles"
    authentication: "none"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/MasterRole"

  # ========================================
  # GET /api/v1/about/master-roles/{id}
  # ========================================
  # Description: Get specific master role details
  # Auth: None (Public)
  master_role_detail:
    method: GET
    path: "/master-roles/{id}"
    description: "Fetch detailed information about a specific master role"
    authentication: "none"
    parameters:
      - name: "id"
        in: "path"
        type: "string"
        required: true
        example: "medical-jyotish"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          $ref: "#/components/schemas/MasterRoleDetail"

  # ========================================
  # GET /api/v1/about/lineage
  # ========================================
  # Description: Get lineage and heritage information
  # Auth: None (Public)
  lineage_info:
    method: GET
    path: "/lineage"
    description: "Fetch information about the 9-generation Vedic lineage"
    authentication: "none"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "object"
          properties:
            title:
              type: "string"
            description:
              type: "string"
            generations:
              type: "integer"
            parampara:
              type: "array"
              items:
                type: "object"
                properties:
                  generation:
                    type: "integer"
                  name:
                    type: "string"
                  period:
                    type: "string"
                  contribution:
                    type: "string"
            tapasyaDetails:
              type: "string"
            ethicsAndPrinciples:
              type: "array"
              items:
                type: "string"

  # ========================================
  # GET /api/v1/about/press
  # ========================================
  # Description: Get press coverage and media appearances
  # Auth: None (Public)
  press_coverage:
    method: GET
    path: "/press"
    description: "Fetch press articles and media appearances"
    authentication: "none"
    parameters:
      - name: "category"
        in: "query"
        type: "string"
        enum: ["Premier Institute", "National Media", "Daily Press"]
        description: "Filter by media category"
      - name: "limit"
        in: "query"
        type: "integer"
        default: 20
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/PressArticle"

  # ========================================
  # GET /api/v1/about/press/publishers
  # ========================================
  # Description: Get list of publications
  # Auth: None (Public)
  press_publishers:
    method: GET
    path: "/press/publishers"
    description: "Fetch list of publications and media houses"
    authentication: "none"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "array"
          items:
            type: "object"
            properties:
              publisher:
                type: "string"
              category:
                type: "string"
              articleCount:
                type: "integer"
              logo:
                type: "string"
                format: "url"

  # ========================================
  # GET /api/v1/about/institute
  # ========================================
  # Description: Get institute information
  # Auth: None (Public)
  institute_info:
    method: GET
    path: "/institute"
    description: "Fetch information about Maharishi Kapi Institute"
    authentication: "none"
    response_schema:
      type: "object"
      properties:
        status:
          type: "string"
        data:
          type: "object"
          properties:
            name:
              type: "string"
            foundedYear:
              type: "integer"
            mission:
              type: "string"
            vision:
              type: "string"
            locations:
              type: "array"
              items:
                type: "object"
                properties:
                  city:
                    type: "string"
                  country:
                    type: "string"
                  address:
                    type: "string"
            contactEmail:
              type: "string"
            contactPhone:
              type: "string"
            website:
              type: "string"
              format: "url"

components:
  schemas:
    MasterRole:
      type: "object"
      properties:
        id:
          type: "string"
        roleNumber:
          type: "string"
        title:
          type: "string"
        sanskritBadge:
          type: "string"
        domain:
          type: "string"
        icon:
          type: "string"
        tagline:
          type: "string"
        photoUrl:
          type: "string"
          format: "url"
        photoCaption:
          type: "string"

    MasterRoleDetail:
      type: "object"
      properties:
        id:
          type: "string"
        roleNumber:
          type: "string"
        title:
          type: "string"
        sanskritBadge:
          type: "string"
        domain:
          type: "string"
        icon:
          type: "string"
        tagline:
          type: "string"
        scope:
          type: "string"
          format: "long text"
        methodology:
          type: "array"
          items:
            type: "string"
        photoUrl:
          type: "string"
          format: "url"
        photoCaption:
          type: "string"
        cardBg:
          type: "string"
        borderColor:
          type: "string"
        pillBg:
          type: "string"
        pillTextColor:
          type: "string"
        relatedCourses:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "string"
              title:
                type: "string"
              slug:
                type: "string"

    PressArticle:
      type: "object"
      properties:
        id:
          type: "string"
        publisher:
          type: "string"
        logoType:
          type: "string"
        editionTag:
          type: "string"
        category:
          type: "string"
        headline:
          type: "string"
        author:
          type: "string"
        topicTag:
          type: "string"
        readTime:
          type: "string"
        publishedDate:
          type: "string"
          format: "date"
        url:
          type: "string"
          format: "url"

database_models:
  - name: "FounderProfile"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "name"
        type: "string"
      - name: "title"
        type: "string"
      - name: "bio"
        type: "string (long)"
      - name: "fullBio"
        type: "string (very long)"
      - name: "profileImage"
        type: "string"
      - name: "backgroundImage"
        type: "string"
      - name: "yearsOfExperience"
        type: "int"
      - name: "lineageGeneration"
        type: "int"
      - name: "instagramHandle"
        type: "string"
      - name: "youtubeChannel"
        type: "string"
      - name: "threadsHandle"
        type: "string"
      - name: "expertise"
        type: "string (JSON array)"
      - name: "createdAt"
        type: "DateTime"
      - name: "updatedAt"
        type: "DateTime"

  - name: "AuthorityStats"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "num"
        type: "string"
      - name: "label"
        type: "string"
      - name: "sub"
        type: "string"
      - name: "icon"
        type: "string"
      - name: "displayOrder"
        type: "int"
      - name: "createdAt"
        type: "DateTime"
      - name: "updatedAt"
        type: "DateTime"

  - name: "MasterRole"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "roleNumber"
        type: "string"
      - name: "title"
        type: "string"
      - name: "sanskritBadge"
        type: "string"
      - name: "domain"
        type: "string"
      - name: "icon"
        type: "string"
      - name: "tagline"
        type: "string"
      - name: "scope"
        type: "string (long)"
      - name: "methodology"
        type: "string (JSON array)"
      - name: "photoUrl"
        type: "string"
      - name: "photoCaption"
        type: "string"
      - name: "cardBg"
        type: "string"
      - name: "borderColor"
        type: "string"
      - name: "pillBg"
        type: "string"
      - name: "pillTextColor"
        type: "string"
      - name: "displayOrder"
        type: "int"
      - name: "createdAt"
        type: "DateTime"
      - name: "updatedAt"
        type: "DateTime"

  - name: "Lineage"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "title"
        type: "string"
      - name: "description"
        type: "string (long)"
      - name: "totalGenerations"
        type: "int"
      - name: "tapasyaDetails"
        type: "string (long)"
      - name: "ethicsAndPrinciples"
        type: "string (JSON array)"
      - name: "createdAt"
        type: "DateTime"
      - name: "updatedAt"
        type: "DateTime"

  - name: "LineageGeneration"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "lineageId"
        type: "Guid (FK)"
      - name: "generation"
        type: "int"
      - name: "name"
        type: "string"
      - name: "period"
        type: "string"
      - name: "contribution"
        type: "string (long)"
      - name: "displayOrder"
        type: "int"

  - name: "PressArticle"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "publisher"
        type: "string"
      - name: "logoType"
        type: "string"
      - name: "editionTag"
        type: "string"
      - name: "category"
        type: "string"
      - name: "headline"
        type: "string (long)"
      - name: "author"
        type: "string"
      - name: "topicTag"
        type: "string"
      - name: "readTime"
        type: "string"
      - name: "publishedDate"
        type: "DateTime"
      - name: "url"
        type: "string"
      - name: "displayOrder"
        type: "int"
      - name: "createdAt"
        type: "DateTime"
      - name: "updatedAt"
        type: "DateTime"

  - name: "Institute"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "name"
        type: "string"
      - name: "foundedYear"
        type: "int"
      - name: "mission"
        type: "string (long)"
      - name: "vision"
        type: "string (long)"
      - name: "contactEmail"
        type: "string"
      - name: "contactPhone"
        type: "string"
      - name: "website"
        type: "string"
      - name: "createdAt"
        type: "DateTime"
      - name: "updatedAt"
        type: "DateTime"

  - name: "InstituteLocation"
    fields:
      - name: "id"
        type: "Guid (PK)"
      - name: "instituteId"
        type: "Guid (FK)"
      - name: "city"
        type: "string"
      - name: "country"
        type: "string"
      - name: "address"
        type: "string (long)"
      - name: "latitude"
        type: "decimal"
      - name: "longitude"
        type: "decimal"
      - name: "phone"
        type: "string"
      - name: "email"
        type: "string"
      - name: "displayOrder"
        type: "int"

caching:
  - endpoint: "/founder"
    ttl_seconds: 86400
    cache_key: "about_founder"
  - endpoint: "/stats"
    ttl_seconds: 86400
    cache_key: "about_stats"
  - endpoint: "/master-roles"
    ttl_seconds: 86400
    cache_key: "about_master_roles"
  - endpoint: "/master-roles/{id}"
    ttl_seconds: 86400
    cache_key: "about_master_role_{id}"
  - endpoint: "/lineage"
    ttl_seconds: 86400
    cache_key: "about_lineage"
  - endpoint: "/press"
    ttl_seconds: 3600
    cache_key: "about_press_{category}"
  - endpoint: "/press/publishers"
    ttl_seconds: 86400
    cache_key: "about_press_publishers"
  - endpoint: "/institute"
    ttl_seconds: 86400
    cache_key: "about_institute"

