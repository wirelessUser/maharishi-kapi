<section class="py-5 sm:py-6 bg-gradient-to-r from-[#f5ede2] via-[#faf7f2] to-[#f5ede2] border-y border-[#e8dac5] relative overflow-hidden font-sans group">
    
    <!-- Sacred Ambient Vignette & Dot Grid -->
    <div class="absolute inset-0 bg-[radial-gradient(#c2a275_1px,transparent_1px)] [background-size:20px_20px] opacity-20 pointer-events-none"></div>

    <!-- Soft Parchment Fade Masks (Hides marquee pop-in at the viewport edges) -->
    <div class="absolute left-0 top-0 bottom-0 w-16 sm:w-36 bg-gradient-to-r from-[#f5ede2] via-[#f5ede2]/80 to-transparent z-10 pointer-events-none"></div>
    <div class="absolute right-0 top-0 bottom-0 w-16 sm:w-36 bg-gradient-to-l from-[#f5ede2] via-[#f5ede2]/80 to-transparent z-10 pointer-events-none"></div>

    <!-- Infinite Scrolling Track (Pauses on Hover) -->
    <div class="relative overflow-hidden w-full">
        <div class="flex items-center gap-10 sm:gap-14 w-max animate-sacred-marquee group-hover:[animation-play-state:paused]">
            <ng-container [ngTemplateOutlet]="tickerRow"></ng-container>
            <ng-container [ngTemplateOutlet]="tickerRow"></ng-container>
        </div>
    </div>
</section>

<!-- ========================================================================= -->
<!-- REUSABLE MARQUEE SEQUENCE TEMPLATE                                        -->
<!-- ========================================================================= -->
<ng-template #tickerRow>
    @for (item of tickerItems; track item.key) {
        
        <!-- Individual Ticker Entry -->
        <div class="flex items-center shrink-0 gap-10 sm:gap-14">
            
            @if (item.type === 'stat') {
                <!-- Metric Plaque -->
                <div class="flex items-center gap-3.5 sm:gap-4 bg-[#fffdfa] border border-[#e8dac5] rounded-2xl px-5 py-2.5 shadow-2xs">
                    <span class="text-3xl sm:text-4xl font-serif font-black text-[#8c5324] leading-none tracking-tight">
                        {{ item.value }}
                    </span>
                    <div class="text-left border-l border-[#f0e4d4] pl-3">
                        <span class="text-[8.5px] font-mono text-[#d97706] font-bold uppercase tracking-widest block leading-tight">
                            {{ item.sanskritTag }}
                        </span>
                        <span class="text-[10px] sm:text-[11px] font-mono font-bold text-[#685546] uppercase tracking-wider block mt-0.5 whitespace-nowrap">
                            {{ item.label }}
                        </span>
                    </div>
                </div>
            } @else if (item.dark) {
                <!-- Dark Logo (Encased in Burnished Terracotta Plaque) -->
                <div class="h-12 px-5 rounded-2xl bg-[#3a2717] border border-[#cbb391] flex items-center shadow-2xs hover:border-[#d97706] transition-colors">
                    <img [src]="item.img" [alt]="item.alt" class="h-5 sm:h-6 w-auto object-contain filter brightness-110 contrast-125">
                </div>
            } @else {
                <!-- Light Logo (Encased in Warm Ivory Plaque) -->
                <div class="h-12 px-5 rounded-2xl bg-[#fffdfa] border border-[#e8dac5] hover:border-[#d97706] flex items-center shadow-2xs transition-all duration-300 group/logo">
                    <img [src]="item.img" [alt]="item.alt" class="h-6 sm:h-7 w-auto object-contain filter sepia-[0.3] contrast-105 opacity-80 group-hover/logo:opacity-100 group-hover/logo:sepia-0 transition-all duration-500">
                </div>
            }

            <!-- Consecrated Vedic Divider -->
            <div class="flex items-center gap-1.5 text-[#d97706]/50 select-none pointer-events-none">
                <span class="w-2.5 h-[1px] bg-[#d8c3a5]"></span>
                <span class="text-xs font-serif text-[#d97706]">❖</span>
                <span class="w-2.5 h-[1px] bg-[#d8c3a5]"></span>
            </div>

        </div>

    }
</ng-template>
